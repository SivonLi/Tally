name: 发布

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查发布信息
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "正式版本只能从 main 分支发布"
            exit 1
          fi
          jq -e '.updates.publicKey and .updates.github' mygo.json > /dev/null
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "缺少 MYGO_UPDATER_PRIVATE_KEY"
            exit 1
          fi
          bash scripts/check-release.sh --github-output

  macos-build:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 25
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 打包
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build

      - name: 体积门槛
        run: |
          size=$(du -sm build/darwin-arm64/Tally.app | cut -f1)
          if [ "$size" -gt 12 ]; then
            echo "应用包 ${size} MB 超过 12 MB"
            exit 1
          fi
          echo "应用包 ${size} MB"

      - name: 收集产物
        run: |
          mkdir -p dist
          find build/darwin-arm64 -maxdepth 1 -type f -exec cp {} dist/ \;
          ditto -c -k --keepParent build/darwin-arm64/Tally.app "dist/Tally-${VERSION}-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: tally-release-macos
          path: dist/
          if-no-files-found: error

  windows-build:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 打包
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build

      - name: 收集产物
        run: |
          mkdir -p dist
          find build/windows-amd64 -maxdepth 1 -type f -exec cp {} dist/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: tally-release-windows
          path: dist/
          if-no-files-found: error

  official-release:
    needs: [prepare, macos-build, windows-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tally-release-macos
          path: dist/macos

      - uses: actions/download-artifact@v4
        with:
          name: tally-release-windows
          path: dist/windows

      - name: 归并产物
        run: |
          cat dist/macos/SHA256SUMS dist/windows/SHA256SUMS | sort -k2 > dist/SHA256SUMS
          rm dist/macos/SHA256SUMS dist/windows/SHA256SUMS
          cp dist/macos/* dist/windows/* dist/
          rm -rf dist/macos dist/windows

      - name: 清理遗留草稿
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            if [ "$draft" != "true" ]; then
              echo "版本 $TAG 已正式发布"
              exit 1
            fi
            gh release delete "$TAG" --yes --cleanup-tag
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "标签 $TAG 已存在并指向 $tag_sha，当前提交是 $GITHUB_SHA"
              exit 1
            fi
          fi

      - name: 发布正式版本
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "Tally $TAG" \
            --generate-notes \
            dist/*
          gh release edit "$TAG" --draft=false --latest
