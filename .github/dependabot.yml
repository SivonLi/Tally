version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: test
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      go-modules-patch:
        patterns: ["*"]
        update-types: ["patch"]
      go-modules-manual:
        patterns: ["*"]
        update-types: ["minor", "major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: test
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions-auto:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions-major:
        patterns: ["*"]
        update-types: ["major"]
